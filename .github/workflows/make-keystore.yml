# One-off: generate a stable debug keystore so every build shares one signing
# key, letting APK updates install in place (preserving permissions, the
# accessibility grant, and app config) instead of forcing an uninstall.
# Run once from the Actions tab, download the artifact, commit the .jks, then
# this workflow can be deleted. The password is intentionally the well-known
# Android debug value -- this is a debug key for a personal sideloaded app, not
# a release key, so it carries no more trust than the stock debug keystore.
name: make-keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore simbridge.jks \
            -storepass android -keypass android \
            -alias simbridge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SimBridge, OU=ARG, O=Aditya Raj Group, L=, S=, C=NP"
          base64 -w0 simbridge.jks > simbridge.jks.b64
      - uses: actions/upload-artifact@v4
        with:
          name: simbridge-keystore
          path: |
            simbridge.jks
            simbridge.jks.b64
