# Builds the APK in CI so you never install the 4 GB Android SDK locally.
# Push this repo to GitHub, then: Actions tab -> build-apk -> Run workflow.
# The APK lands under "Artifacts" on the finished run.
name: build-apk

on:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # No gradle wrapper checked in (its .jar is a binary), so call gradle directly.
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: simbridge-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
